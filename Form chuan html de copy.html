<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phối hợp Kiểm tra gửi NHNN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
    <style>
        @page {
            size: A4;
            margin: 20mm;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            width: 210mm;
            /* Width of A4 */
            margin: 0 auto;
        }

        p {
            text-align: justify;

        }

        p,
        h1,
        h2,
        h3,
        div:not(table *) {
            text-align: justify;
            line-height: 1;
            /* Single spacing */
        }

        table td,
        table th {
            line-height: 1;
            /* Single spacing */
        }

        td p {
            margin: 0;
            /* Đảm bảo văn bản trong ô không có spacing */
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }

        .bold {
            font-weight: bold;
        }

        .underline {
            text-decoration: underline;
        }

        .signature {
            margin-top: 50px;
        }

        .content {
            margin-left: 40px;
        }

        .red {
            color: red;
        }

        .buttons {
            text-align: center;
            margin-bottom: 20px;
        }

        @media print {
            #footer {
                position: fixed;
                bottom: 0;
                width: 100%;
                text-align: right;
                /* Đảm bảo rằng nền footer là trắng để tránh chồng lấp */
                padding: 10px 0;
                /* Đường kẻ ngăn cách footer với nội dung */
            }

            /* Ẩn các phần tử khác nếu cần */
            #in * {
                visibility: hidden;
            }

            #footer,
            #footer,
            #content * {
                visibility: visible;
            }

            /* Nếu bạn muốn hiện các phần khác của nội dung, hãy tùy chỉnh các selector */
        }
    </style>

</head>

<body contenteditable="true">
    <div id="in" style="display: flex; gap: 10px; margin: 10px 0;"></div>
    <button type="button" class="btn btn-outline-primary" onclick="window.print()">Print</button>
    <button id="exportBtn" type="button" class="btn btn-outline-primary" onclick="exportHTML()">Xuất file DOC</button>
    <button id="editBtn" type="button" class="btn btn-outline-primary" onclick="toggleEditContent()">Bật chỉnh
        sửa</button>
    </div>

    </button>

    <script>
        // Initialize editable state based on body's contentEditable
        let isEditable = document.body.contentEditable === 'true';
        const editBtn = document.getElementById('editBtn');
        editBtn.textContent = isEditable ? 'Tắt chỉnh sửa' : 'Bật chỉnh sửa';

        function toggleEditContent() {
            const contentBody = document.body;

            isEditable = !isEditable;
            contentBody.contentEditable = isEditable;

            // Update UI based on state
            if (isEditable) {
                contentBody.spellcheck = false;
                editBtn.textContent = 'Tắt chỉnh sửa';
                contentBody.style.border = '1px dashed #4CAF50';
            } else {
                contentBody.spellcheck = false;
                editBtn.textContent = 'Bật chỉnh sửa';
                contentBody.style.border = 'none';
            }
        }
    </script>
    <select id="textSpacing" class="form-select" onchange="adjustTextSpacing(this.value)"
        style="display: inline-block; width: auto; margin-right: 10px; cursor: pointer; border: 1px solid #0d6efd; color: #0d6efd; border-radius: 0.375rem; padding: 0.375rem 0.75rem; background: transparent;"
        onmouseover="this.style.background='#0d6efd'; this.style.color='white';"
        onmouseout="this.style.background='transparent'; this.style.color='#0d6efd';">
        <option value="1">Văn bản - Dãn dòng đơn</option>
        <option value="1.5">Văn bản - Dãn dòng 1.5</option>
        <option value="2">Văn bản - Dãn dòng đôi</option>
    </select>
    <select id="tableSpacing" class="form-select" onchange="adjustTextSpacing(this.value)"
        style="display: inline-block; width: auto; margin-right: 10px; cursor: pointer; border: 1px solid #0d6efd; color: #0d6efd; border-radius: 0.375rem; padding: 0.375rem 0.75rem; background: transparent;"
        onmouseover="this.style.background='#0d6efd'; this.style.color='white';"
        onmouseout="this.style.background='transparent'; this.style.color='#0d6efd';">

        <option value="1">Bảng - Dãn dòng đơn</option>
        <option value="1.5">Bảng - Dãn dòng 1.5</option>
        <option value="2">Bảng - Dãn dòng đôi</option>
    </select>

    <script>
        function adjustTextSpacing(spacing) {
            const content = document.getElementById('content');
            const paragraphs = content.querySelectorAll('p:not(table p)');
            paragraphs.forEach(p => p.style.lineHeight = spacing);
        }

        function adjustTableSpacing(spacing) {
            const tables = document.querySelectorAll('table p');
            tables.forEach(p => p.style.lineHeight = spacing);
        }
        function exportHTML() {
            // Hiển thị hộp thoại để người dùng nhập tên file
            const fileName = prompt("Nhập tên file:", "document.doc");
            if (!fileName) {
                alert("Đã hủy xuất file.");
                return; // Nếu người dùng không nhập tên, thoát hàm
            }

            // Tạo header HTML cho Word
            var header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' " +
                "xmlns:w='urn:schemas-microsoft-com:office:word' " +
                "xmlns='http://www.w3.org/TR/REC-html40'>" +
                "<head><meta charset='utf-8'><title>Export HTML to Word Document</title>" +
                "<style>" +
                "@page { size: A4; margin: 20mm; }" +
                "body { font-family: 'Times New Roman', Times, serif; width: 210mm; margin: 0 auto; }" +
                ".center { text-align: center; }" +
                ".right { text-align: right; }" +
                "td p { margin: 0; }" +
                "p { text-align: justify; line-height: 1; margin: 0; }" +
                ".bold { font-weight: bold; }" +
                ".underline { text-decoration: underline; }" +
                ".signature { margin-top: 50px; }" +
                ".content { margin-left: 40px; }" +
                ".red { color: red; }" +
                ".buttons { text-align: center; margin-bottom: 20px; }" +
                "</style>" +
                "</head><body>";

            // Lấy nội dung trong #content
            var sourceHTML = header + document.getElementById("content").innerHTML + "</body></html>";

            // Tạo liên kết tải xuống
            var source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            var fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;

            // Sử dụng tên file từ prompt
            fileDownload.download = fileName.endsWith(".doc") ? fileName : fileName + ".doc";
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }

    </script>
    </div>

</body>

</html>
